name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pestcontrol_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pestcontrol_ci_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pestcontrol_ci_test
      CORS_ALLOWED_ORIGINS: https://app.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Generate ephemeral authentication secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Generate and validate Prisma
        working-directory: backend
        run: npm run prisma:generate && npx prisma validate
      - name: Apply fresh migration and prove replay
        working-directory: backend
        run: npm run prisma:migrate:deploy && npm run prisma:migrate:deploy && npm run prisma:migrate:status
      - name: Backend checks and tests
        working-directory: backend
        run: npm run check && npm test && npm audit --audit-level=low
      - name: Install and build frontend
        working-directory: frontend
        run: npm ci && npm run build && npm audit --audit-level=low
      - name: Build production image
        run: docker build --build-arg DATABASE_URL="$DATABASE_URL" .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
